[package]
name = "oh-my-macro"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "StarCraft 1 macro helper (Creep Colony / Spire) for Windows"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# PNG decoding for the F6 selection/placement pixel detectors. `image` already
# pulls `png` in transitively through `eframe`; promoting it directly (with no
# extra features) keeps the detector testable on every host without adding a
# heavy imaging stack.
png = { version = "0.18", default-features = false }

# The GUI and every Win32 call live behind `cfg(windows)`, so the pure
# macro/config/engine code is testable on any host.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "oh_my_macro"
path = "src/lib.rs"
