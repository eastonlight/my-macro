name: Apply macro update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rep(path, old, new, n=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              c = s.count(old)
              if c != n:
                  raise SystemExit(f'{path}: expected {n}, got {c}: {old[:100]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          def sub(path, pat, repl, n=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              out, c = re.subn(pat, repl, s, flags=re.S)
              if c != n:
                  raise SystemExit(f'{path}: expected {n} regex matches, got {c}')
              p.write_text(out, encoding='utf-8')

          # F6 -> tilde/backtick, F7 -> Tab.
          rep('src/hotkey.rs',
              '/// The F-keys a user may bind to a macro. F8 stays reserved.',
              '/// Keys a user may bind to a macro. F8 stays reserved.')
          rep('src/hotkey.rs',
              'pub enum HotkeyKey {\n    #[serde(rename = "F1")]\n    F1,',
              'pub enum HotkeyKey {\n    #[serde(rename = "Tilde")]\n    Tilde,\n    #[serde(rename = "Tab")]\n    Tab,\n    #[serde(rename = "F1")]\n    F1,')
          rep('src/hotkey.rs',
              '    pub const ALL: [Self; 12] = [\n        Self::F1,',
              '    pub const ALL: [Self; 14] = [\n        Self::Tilde,\n        Self::Tab,\n        Self::F1,')
          rep('src/hotkey.rs',
              '        match self {\n            Self::F1 => "F1",',
              '        match self {\n            Self::Tilde => "Tilde",\n            Self::Tab => "Tab",\n            Self::F1 => "F1",')
          rep('src/hotkey.rs',
              '    /// Win32 virtual key code (`VK_F1` .. `VK_F12`).\n    pub const fn virtual_key(self) -> u16 {\n        0x70 + (self as u16)\n    }',
              '    /// Win32 virtual key code used by RegisterHotKey.\n    pub const fn virtual_key(self) -> u16 {\n        match self {\n            Self::Tilde => 0xC0,\n            Self::Tab => 0x09,\n            Self::F1 => 0x70,\n            Self::F2 => 0x71,\n            Self::F3 => 0x72,\n            Self::F4 => 0x73,\n            Self::F5 => 0x74,\n            Self::F6 => 0x75,\n            Self::F7 => 0x76,\n            Self::F8 => 0x77,\n            Self::F9 => 0x78,\n            Self::F10 => 0x79,\n            Self::F11 => 0x7A,\n            Self::F12 => 0x7B,\n        }\n    }')

          rep('src/config.rs',
              'pub const DEFAULT_TRIGGER_HOTKEY: HotkeyKey = HotkeyKey::F6;',
              'pub const DEFAULT_TRIGGER_HOTKEY: HotkeyKey = HotkeyKey::Tilde;')
          rep('src/config.rs',
              'pub const DEFAULT_SPIRE_ACTION_HOTKEY: HotkeyKey = HotkeyKey::F7;',
              'pub const DEFAULT_SPIRE_ACTION_HOTKEY: HotkeyKey = HotkeyKey::Tab;')
          rep('src/config.rs',
              '        let config = file.into_config()?;\n        config.validate()?;\n        Ok(config)',
              '        let mut config = file.into_config()?;\n        if config.trigger_hotkey == HotkeyKey::F6 && config.spire_action_hotkey == HotkeyKey::F7 {\n            config.trigger_hotkey = DEFAULT_TRIGGER_HOTKEY;\n            config.spire_action_hotkey = DEFAULT_SPIRE_ACTION_HOTKEY;\n        }\n        config.validate()?;\n        Ok(config)')

          # Spire is the same calibrated size as Creep Colony: 144 px.
          rep('src/macros.rs', '            Self::Spire => 216,', '            Self::Spire => 144,')
          rep('src/macros.rs',
              '    /// `V`,`S` — square 3x3 footprint.',
              '    /// `V`,`S` — same calibrated footprint as the Creep Colony.')

          # Add 6x2 mode. Cursor is lower-left: steps 1..6 bottom row,
          # steps 7..12 immediately above it.
          rep('src/colony.rs',
              '    EndsInward,\n}',
              '    EndsInward,\n    /// 6 columns x 2 rows: 1..6 on the bottom row, 7..12 on the row above.\n    Grid6x2,\n}')
          rep('src/colony.rs',
              '    pub const ALL: [Self; 2] = [Self::LeftToRight, Self::EndsInward];',
              '    pub const ALL: [Self; 3] = [Self::LeftToRight, Self::EndsInward, Self::Grid6x2];')
          rep('src/colony.rs',
              '            Self::EndsInward => "ends_inward",\n        }',
              '            Self::EndsInward => "ends_inward",\n            Self::Grid6x2 => "grid_6x2",\n        }')
          rep('src/colony.rs',
              '            Self::EndsInward => {\n                let outer = step / 2;\n                if step.is_multiple_of(2) {\n                    outer\n                } else {\n                    count - 1 - outer\n                }\n            }\n        }',
              '            Self::EndsInward => {\n                let outer = step / 2;\n                if step.is_multiple_of(2) {\n                    outer\n                } else {\n                    count - 1 - outer\n                }\n            }\n            Self::Grid6x2 => step % 6,\n        }')
          rep('src/colony.rs',
              '            None => Err(serde::de::Error::custom(format!(\n                "unknown colony row mode \'{value}\'; expected \'{}\' or \'{}\'",\n                Self::LeftToRight.as_str(),\n                Self::EndsInward.as_str()\n            ))),',
              '            None => Err(serde::de::Error::custom(format!(\n                "unknown colony row mode \'{value}\'; expected \'{}\', \'{}\' or \'{}\'",\n                Self::LeftToRight.as_str(),\n                Self::EndsInward.as_str(),\n                Self::Grid6x2.as_str()\n            ))),')
          rep('src/colony.rs',
              '    let targets: Vec<Point> = (0..count)\n        .map(|step| {\n            let index = mode.footprint_index(step, count);\n            anchor.offset(footprint * i32::from(index), 0)\n        })\n        .collect();',
              '    let targets: Vec<Point> = (0..count)\n        .map(|step| match mode {\n            RowMode::Grid6x2 => {\n                let column = step % 6;\n                let row = step / 6;\n                anchor.offset(\n                    footprint * i32::from(column),\n                    -footprint * i32::from(row),\n                )\n            }\n            _ => {\n                let index = mode.footprint_index(step, count);\n                anchor.offset(footprint * i32::from(index), 0)\n            }\n        })\n        .collect();')

          # UI label for the new mode and corrected equal-size wording.
          rep('src/ui_text.rs',
              '    pub row_mode_ends_inward: &\'static str,',
              '    pub row_mode_ends_inward: &\'static str,\n    pub row_mode_grid_6x2: &\'static str,')
          rep('src/ui_text.rs',
              '            row_mode_ends_inward: "양끝→가운데",',
              '            row_mode_ends_inward: "양끝→가운데",\n            row_mode_grid_6x2: "6x2 (1~6 아래 / 7~12 위)",', n=1)
          rep('src/ui_text.rs',
              '            row_mode_ends_inward: "Ends inward",',
              '            row_mode_ends_inward: "Ends inward",\n            row_mode_grid_6x2: "6x2 (1-6 bottom / 7-12 top)",', n=1)
          rep('src/ui_text.rs',
              '            RowMode::EndsInward => self.row_mode_ends_inward,\n        }',
              '            RowMode::EndsInward => self.row_mode_ends_inward,\n            RowMode::Grid6x2 => self.row_mode_grid_6x2,\n        }')
          rep('src/ui_text.rs', '둥지탑 (3x3)', '둥지탑 (2x2)', n=1)
          rep('src/ui_text.rs', 'Spire (3x3)', 'Spire (2x2)', n=1)
          rep('src/ui_text.rs', '둥지탑 3타일(216px)', '둥지탑 2타일(144px)', n=1)
          rep('src/ui_text.rs', 'Spire 3 tiles (216 px)', 'Spire 2 tiles (144 px)', n=1)
          PY

      - name: Format and build
        run: |
          cargo fmt --all
          cargo build --release --locked

      - name: Commit source update
        shell: bash
        run: |
          git rm .github/workflows/apply-key-spacing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hotkey.rs src/config.rs src/macros.rs src/colony.rs src/ui_text.rs
          git commit -m "Add Tilde Tab hotkeys and 6x2 build mode"
          git push origin HEAD:main

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: my-macro-windows-latest
          path: target/release/oh-my-macro.exe
          if-no-files-found: error
          retention-days: 7
